<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halaman Tidak Ditemukan | TEKO TUKU</title>
  <link rel="stylesheet" href="style.css">
  <script src="error-handler.js"></script>
  <style>
    .error-page{min-height:100vh;display:grid;place-items:center;background:var(--paper);padding:24px}
    .error-card{width:min(520px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;padding:40px 32px;text-align:center;box-shadow:0 25px 60px #00000012}
    .error-card .brand{justify-content:center;margin-bottom:26px}
    .error-code{font-family:Manrope,sans-serif;font-size:clamp(80px,18vw,130px);font-weight:800;line-height:1;letter-spacing:-6px;color:var(--yellow);-webkit-text-stroke:2px var(--ink);margin:0}
    .error-card h1{font-size:26px;margin:14px 0 10px}
    .error-card p{color:var(--muted);line-height:1.8;margin-bottom:26px}
    .error-card .error-code{color:var(--yellow)}
    .error-card .primary-btn{margin:auto}
    .error-hint{margin-top:18px;font-size:12px;color:var(--muted)}
    @media(max-width:600px){.error-card{padding:30px 20px}.error-code{letter-spacing:-3px}}
  </style>
</head>
<body>
  <main class="error-page">
    <div class="error-card">
      <a class="brand" href="index.html"><img class="brand-mark" src="assets/banner-logo-640.jpg" alt="Logo TEKO TUKU"><span>TEKO <b>TUKU</b><small>Komputer &amp; Aksesoris</small></span></a>
      <p class="error-code">404</p>
      <h1>Halaman tidak ditemukan</h1>
      <p>Maaf, alamat yang kamu buka tidak tersedia atau sudah dipindahkan. Kembali ke beranda untuk melihat produk TEKO TUKU.</p>
      <a class="primary-btn" href="index.html">Kembali ke Beranda</a>
      <p class="error-hint">Kode error: 404 &middot; Halaman tidak ditemukan</p>
    </div>
  </main>
</body>
</html>
