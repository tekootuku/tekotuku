<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin Produk | TEKO TUKU</title><link rel="stylesheet" href="style.css"></head>
<body><header class="site-header"><div class="container nav"><a class="brand" href="index.html"><span class="brand-mark">T</span><span>TEKO <b>TUKU</b><small>Admin Produk</small></span></a><a class="primary-btn" href="index.html">Lihat Toko</a></div></header>
<main class="container admin-wrap"><div class="admin-top"><div><span class="eyebrow">PENGELOLAAN TOKO</span><h2>Dashboard produk</h2><p style="color:var(--muted)">Tambah, ubah, atau hapus produk toko.</p></div></div>
<form class="admin-form" id="product-form"><input type="hidden" id="product-id"><input id="name" placeholder="Nama produk" required><input id="price" type="number" min="0" placeholder="Harga (contoh: 175000)" required><select id="category" required><option value="">Pilih kategori</option><option>RAM</option><option>Storage</option><option>Printer</option><option>Networking</option><option>Aksesoris</option></select><input id="image" type="url" placeholder="URL gambar produk (opsional)"><textarea id="description" placeholder="Deskripsi produk (opsional)"></textarea><button class="primary-btn" type="submit" id="save-button">Simpan produk</button><button class="small-btn" type="button" onclick="resetForm()">Kosongkan form</button></form>
<h3>Daftar produk</h3><table class="admin-list"><thead><tr><th>Produk</th><th>Kategori</th><th>Harga</th><th>Aksi</th></tr></thead><tbody id="admin-products"></tbody></table>
<p style="color:var(--muted);font-size:12px;margin-top:24px">Catatan: data tersimpan di browser ini (LocalStorage). Untuk menyinkronkan produk ke semua pengunjung website, diperlukan database online.</p></main><script src="admin.js"></script></body></html>
